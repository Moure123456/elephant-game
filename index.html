<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elephant Game - لعبة الفيل</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }
        #jump-btn {
            position: absolute;
            left: 20px;
            bottom: 25px;
            width: 80px;
            height: 80px;
            background: rgba(255, 140, 0, 0.85);
            border: 3px solid #fff;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            touch-action: manipulation;
        }
        #jump-btn:active {
            background: rgba(230, 100, 0, 0.95);
            transform: scale(0.95);
        }
        #joystick-container {
            position: absolute;
            right: 25px;
            bottom: 25px;
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 32px;
            left: 32px;
            width: 46px;
            height: 46px;
            background: #8e44ad;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="jump-btn">قفز ⬆️</div>
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <!-- استدعاء ملف تشغيل اللعبة الأساسي -->
    <script src="script.js"></script>
</body>
</html>
